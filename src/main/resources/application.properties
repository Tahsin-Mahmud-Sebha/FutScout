spring.application.name=FutScout

# Server Port Configuration
# Render/Railway/Heroku-style hosts inject PORT; fall back to 8080 for local runs
server.port=${PORT:8080}

# MongoDB Configuration
# Set MONGODB_URI in your host's environment variables tab - do not hardcode credentials here.
# Spring Boot 4 renamed this property from spring.data.mongodb.uri to spring.mongodb.uri.
# Falls back to a local MongoDB instance if MONGODB_URI isn't set, so `mvn spring-boot:run`
# works out of the box during local development.
spring.mongodb.uri=mongodb+srv://Sebha:mAfCyezZDO8828dx@cluster0.7sw4ljm.mongodb.net/futscout?appName=Cluster0

# The frontend sends position values as plain strings (e.g. "ST", "GK") - this keeps
# any future enum-backed fields tolerant of case differences from the UI.
spring.jackson.mapper.accept-case-insensitive-enums=true

# Actuator Metrics Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.metrics.enabled=true
